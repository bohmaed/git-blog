backend:
  name: github
  repo: bohmaed/git-blog
  branch: main
  auth_type: ""

media_folder: "/static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "المقالات"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      
      # التاريخ بالصيغة القياسية لمنع اختفاء المقالات
      - label: "تاريخ النشر"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - { label: "الوصف", name: "description", widget: "string", required: false }
      
      # الصورة البارزة (الاسم الصحيح الذي يقرأه الثيم featured_image)
      - label: "الصورة البارزة"
        name: "image"
        widget: "image"
        required: false

      - { label: "الكاتب", name: "author", widget: "string", required: false, default: "مدير الموقع" }

      # الوسوم (تعمل كقائمة صحيحة)
      - label: "الوسوم"
        name: "tags"
        widget: "list"
        required: false

      # التصنيفات (تعمل كقائمة صحيحة لتظهر في القوائم المنسدلة)
      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        required: false

      - { label: "مسودة؟", name: "draft", widget: "boolean", default: false }
      - { label: "المحتوى", name: "body", widget: "markdown" }
