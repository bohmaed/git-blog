backend:
  name: github
  repo: bohmaed/git-blog  # اكتب اسم حسابك بدلاً من username
  branch: main
  base_url: https://sveltia-cms-auth.vercel.app
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "المقالات"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "تاريخ النشر", name: "date", widget: "datetime"}
      - {label: "الوصف", name: "description", widget: "string"}
      - {label: "المحتوى", name: "body", widget: "markdown"}
