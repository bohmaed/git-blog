backend:
  name: github
  repo: bohmaed/git-blog
  branch: main
  auth_type: ""

media_folder: "static/images"
public_folder: "/images"
collections:
  - name: "posts"
    label: "المقالات"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      
      # --- تاريخ النشر محدد بصيغة زملية دقيقة تضمن الظهور الفوري ---
      - label: "تاريخ النشر"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"

      - { label: "الوصف", name: "description", widget: "string", required: false }
      
      # --- الصورة البارزة والكاتب ---
      - label: "الصورة البارزة"
        name: "image"
        widget: "image"
        required: false
      - { label: "الكاتب", name: "author", widget: "string", required: false, default: "مدير الموقع" }

      # --- الوسوم والتصنيفات القياسية لـ Hugo ---
      - label: "الوسوم"
        name: "tags"
        widget: "list"
        required: false

      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        required: false

      - { label: "مسودة؟", name: "draft", widget: "boolean", default: false }
      - { label: "المحتوى", name: "body", widget: "markdown" }
