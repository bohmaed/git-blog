baseURL = 'https://bohmaed.github.io/git-blog/'
languageCode = 'ar'
defaultContentLanguage = 'ar'
title = 'مدونتي الرقمية'
theme = 'newsroom'

[params]
  description = "مجلة ومدونة شخصية"
  dateFormat = "January 2, 2006"

# 1. تعريف التصنيفات والوسوم إجبارياً لكي يقرأها Hugo والثيم
[taxonomies]
  category = "categories"
  tag = "tags"

# 2. القائمة العلوية وروابط التنقل
[menu]
  [[menu.main]]
    name = "الرئيسية"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "التصنيفات"
    url = "/categories/"
    weight = 2

  [[menu.main]]
    name = "الوسوم"
    url = "/tags/"
    weight = 3

  [[menu.main]]
    name = "عن الموقع"
    url = "/about/"
    weight = 4

  [[menu.main]]
    name = "اتصل بنا"
    url = "/contact/"
    weight = 5
